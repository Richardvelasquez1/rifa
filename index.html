<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gran Rifa: Messi vs Ronaldo</title>
    <style>
        :root {
            --messi-soft: #d0e7ff;
            --ronaldo-soft: #fdf5e6;
            --messi-blue: #75b7e9;
            --ronaldo-gold: #bfa35a;
        }

        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
        }

        .main-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            text-align: center;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .hero-banner {
            width: 100%;
            height: 180px;
            background: #000 url('Fondo.jpg') no-repeat center top;
            background-size: cover;
            display: flex;
            align-items: flex-end;
            border-bottom: 3px solid #000;
        }

        .title-overlay {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            width: 100%;
            padding: 8px 0;
            font-size: 1.6em;
            font-weight: bold;
        }

        .content { padding: 15px; }

        .prizes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }

        .prize-box {
            border: 2px solid #000;
            border-radius: 8px;
            padding: 5px;
            background: #fff;
        }

        .prize-img {
            width: 100%;
            height: 100px;
            object-fit: contain;
        }

        .price-tag {
            background: #000;
            color: #fff;
            padding: 8px 25px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
            border-radius: 4px;
        }

        .section-header {
            background: #333;
            color: #fff;
            padding: 5px;
            margin: 15px 0 5px 0;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            border: 1px solid #000;
            background: #000;
            gap: 1px;
            margin-bottom: 10px;
        }

        .cell {
            padding: 10px 0;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }

        .messi-range { background-color: var(--messi-soft); }
        .ronaldo-range { background-color: var(--ronaldo-soft); }

        .sold {
            background-color: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; overflow-y: auto; }
        .modal-content { background:#fff; width: 90%; max-width: 350px; margin: 5% auto; padding: 20px; border-radius: 10px; text-align: left; }
        
        input, select { 
            width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; 
        }

        .btn-wa { 
            background:#ccc; 
            color:#fff; 
            display:block; 
            padding:15px; 
            text-decoration:none; 
            border-radius:5px; 
            font-weight:bold; 
            text-align:center; 
            margin-top:10px;
            pointer-events: none;
            transition: 0.3s;
        }

        .btn-wa.active {
            background: #25d366;
            pointer-events: auto;
        }

        label { font-weight: bold; font-size: 12px; color: #333; text-transform: uppercase; }
        .bank-data { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #bfa35a; font-size: 13px; }
        .whatsapp-note { background: #e7fbe2; padding: 8px; border-radius: 5px; color: #1e7e34; font-size: 12px; font-weight: bold; text-align: center; border: 1px solid #c3e6cb; margin-top: 5px;}
    </style>
</head>
<body>

<div class="main-card">
    <div class="hero-banner"><div class="title-overlay">GRAN RIFA</div></div>

    <div class="content">
        <p>📅 <strong>SORTEO: 15 DE MAYO</strong></p>
        <div class="prizes-grid">
            <div class="prize-box" style="border-top: 5px solid var(--messi-blue);">
                <img src="Messi.jpg" class="prize-img">
                <p style="font-size:11px;">Messi (01-50)</p>
            </div>
            <div class="prize-box" style="border-top: 5px solid var(--ronaldo-gold);">
                <img src="Ronaldo.jpg" class="prize-img">
                <p style="font-size:11px;">Ronaldo (01-50)</p>
            </div>
        </div>
        <div class="price-tag">VALOR: 1$ (BCV)</div>
        <div class="section-header">LISTA MESSI</div>
        <div class="grid-container" id="gridMessi"></div>
        <div class="section-header">LISTA RONALDO</div>
        <div class="grid-container" id="gridRonaldo"></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin:0; text-align: center;"></h2>
        <p id="modalInfo" style="text-align: center; font-weight: bold; color: #d32f2f; margin: 5px 0;"></p>
        
        <div class="bank-data">
            <strong>DATOS DE PAGO MÓVIL:</strong><br>
            Provincial | 0414-9778514 | V-14806785
        </div>

        <label>Nombre del Concursante:</label>
        <input type="text" id="userName" placeholder="Nombre y Apellido" oninput="validateForm()">
        
        <label>Banco de Origen:</label>
        <select id="userBank" onchange="validateForm()">
            <option value="">Seleccione Banco</option>
            <option value="Provincial">Provincial</option>
            <option value="Banesco">Banesco</option>
            <option value="Mercantil">Mercantil</option>
            <option value="Venezuela">Venezuela</option>
            <option value="BNC">BNC</option>
            <option value="Otro">Otro</option>
        </select>

        <label>Cédula del Titular (de la cuenta):</label>
        <input type="number" id="userCedula" placeholder="Ej: 12345678" oninput="validateForm()">

        <label>Teléfono del Titular (de la cuenta):</label>
        <input type="number" id="userPhone" placeholder="Ej: 04121234567" oninput="validateForm()">

        <label>Monto Transferido (Bs):</label>
        <input type="number" id="userAmount" placeholder="Ej: 45.50" oninput="validateForm()">

        <div class="whatsapp-note">
            Recuerda enviar el capture de la transferencia desde WhatsApp.
        </div>

        <a href="#" id="btnSend" onclick="sendWhatsApp()" class="btn-wa">REPORTAR PAGO</a>
        <button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; color:red; cursor:pointer; font-size: 14px;">Cancelar</button>
    </div>
</div>

<script>
    // --- GESTIÓN DE VENDIDOS (EDITAR AQUÍ) ---
    const vendidosMessi = ["10", "15", "11", "24", "25", "32", "34", "44", "48", "14", "40", "29", "42", "17", "23", "27", "36","26","28", "31", "37", "49", "08"]; 
    const vendidosRonaldo = ["15", "10", "24", "25", "34", "44", "48", "17", "22", "27", "42", "30", "28", "06"]; 

    let selectedNumber = "";
    let selectedGroup = "";

    function generateGrid(containerId, isMessi) {
        const container = document.getElementById(containerId);
        const listaVendidos = isMessi ? vendidosMessi : vendidosRonaldo;
        for (let i = 1; i <= 50; i++) {
            const num = i.toString().padStart(2, '0');
            const cell = document.createElement('div');
            if (listaVendidos.includes(num)) {
                cell.className = 'cell sold';
                cell.innerText = "X";
            } else {
                cell.className = 'cell ' + (isMessi ? 'messi-range' : 'ronaldo-range');
                cell.innerText = num;
                cell.onclick = () => openModal(num, isMessi);
            }
            container.appendChild(cell);
        }
    }

    function openModal(num, isMessi) {
        selectedNumber = num;
        selectedGroup = isMessi ? "MESSI (Terminal A)" : "RONALDO (Terminal B)";
        document.getElementById('modalTitle').innerText = "Número: " + num;
        document.getElementById('modalInfo').innerText = "Juegas por: " + selectedGroup;
        document.getElementById('modal').style.display = "block";
        validateForm();
    }

    function closeModal() {
        document.getElementById('modal').style.display = "none";
        document.getElementById('userName').value = "";
        document.getElementById('userAmount').value = "";
        document.getElementById('userBank').value = "";
        document.getElementById('userCedula').value = "";
        document.getElementById('userPhone').value = "";
        validateForm();
    }

    function validateForm() {
        const name = document.getElementById('userName').value.trim();
        const amount = document.getElementById('userAmount').value.trim();
        const bank = document.getElementById('userBank').value;
        const cedula = document.getElementById('userCedula').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const btn = document.getElementById('btnSend');

        if (name && amount && bank && cedula && phone) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    function sendWhatsApp() {
        const name = document.getElementById('userName').value;
        const amount = document.getElementById('userAmount').value;
        const bank = document.getElementById('userBank').value;
        const cedula = document.getElementById('userCedula').value;
        const phone = document.getElementById('userPhone').value;

        const msg = encodeURIComponent(
            `*REPORTE DE PAGO RIFA*\n` +
            `--------------------------\n` +
            `*Número:* ${selectedNumber}\n` +
            `*Sorteo:* ${selectedGroup}\n` +
            `--------------------------\n` +
            `*Concursante:* ${name}\n` +
            `*Banco Origen:* ${bank}\n` +
            `*Cédula Titular:* ${cedula}\n` +
            `*Teléfono Titular:* ${phone}\n` +
            `*Monto Pagado:* Bs. ${amount}\n` +
            `--------------------------\n` +
            `_Adjunto el capture del pago móvil a continuación:_`
        );

        window.open(`https://wa.me/584149778514?text=${msg}`, '_blank');
        closeModal();
    }

    generateGrid('gridMessi', true);
    generateGrid('gridRonaldo', false);
</script>

</body>
</html>
